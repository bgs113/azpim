version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    targets:
      - darwin_amd64_v1
      - darwin_arm64
      - linux_amd64_v1
      - linux_arm64
      - windows_amd64_v1
      - windows_arm64

kos:
  # Needs GoReleaser >= v2.18.0 (built with Go 1.27). Older versions fail with
  # `ko: azpim does not contain a valid local import path () for directory (.)`,
  # which is why image publishing was paused from v1.0.1 to v1.1.0 (#11).
  - base_image: cgr.dev/chainguard/static:latest
    bare: true
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{if not .Prerelease}}latest{{end}}"
    platforms:
      - linux/amd64
      - linux/arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - --yes
      - ${artifact}

# Deliberately a Formula, not a Cask, despite GoReleaser's `brews` deprecation
# warning. Casks re-apply macOS's quarantine attribute, so Gatekeeper blocks the
# un-notarized binary (PR #7, CHANGELOG 1.0.1), and Homebrew 5.0 removed the
# --no-quarantine escape hatch. A Cask only becomes an option if the macOS
# binaries are signed and notarized (GoReleaser `notarize`, Apple Developer ID).
#
# The Formula installs the release ZIPs built and checksummed here, so Homebrew
# users get the same artifacts that checksums.txt signs and the SBOMs describe.
# When GoReleaser removes `brews`, keep that: render the same binary Formula
# (version, URLs, sha256s) in a release.yml step and push it to the tap with
# HOMEBREW_TAP_GITHUB_TOKEN. Don't switch to a source-built Formula; it would
# compile on users' machines (or need a second bottle-building pipeline in the
# tap) outside this signed build.
brews:
  - name: azpim
    repository:
      owner: bgs113
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/bgs113/azpim
    description: "CLI for managing Azure Privileged Identity Management (PIM) role assignments"
    skip_upload: auto
    install: |
      bin.install "azpim"
    test: |
      system bin/"azpim", "version"

sboms:
  - artifacts: archive

archives:
  - formats:
      - zip
    name_template: "azpim-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt" # release.yml attests the files listed here
  algorithm: sha256

docker_digest:
  name_template: "digests.txt" # release.yml attests the images listed here
