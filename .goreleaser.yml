version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    targets:
      - darwin_amd64_v1
      - darwin_arm64
      - linux_amd64_v1
      - linux_arm64
      - windows_amd64_v1
      - windows_arm64

kos:
  - base_image: cgr.dev/chainguard/static:latest
    bare: true
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{if not .Prerelease}}latest{{end}}"
    platforms:
      - linux/amd64
      - linux/arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - --yes
      - ${artifact}

homebrew_casks:
  - name: azpim
    binaries:
      - azpim
    repository:
      owner: bgs113
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/bgs113/azpim
    description: "CLI for managing Azure Privileged Identity Management (PIM) role assignments"
    skip_upload: auto

sboms:
  - artifacts: archive

archives:
  - formats:
      - zip
    name_template: "azpim-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Use GitHub's native release notes (short SHAs, grouped by label/PR)
changelog:
  use: github-native
