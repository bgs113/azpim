version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    targets:
      - darwin_amd64_v1
      - darwin_arm64
      - linux_amd64_v1
      - linux_arm64
      - windows_amd64_v1
      - windows_arm64

kos:
  # ko (bundled in goreleaser) breaks when driven by a Go 1.27 compiler: it
  # miscomputes the local import path and fails with
  # `ko: azpim does not contain a valid local import path () for directory (.)`.
  # Reproduces even on pre-1.27 source, so it's an upstream ko/x-tools bug,
  # not anything in this repo. Re-enable once ko ships a fix.
  # https://github.com/google/ko
  - disable: "true"
    base_image: cgr.dev/chainguard/static:latest
    bare: true
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{if not .Prerelease}}latest{{end}}"
    platforms:
      - linux/amd64
      - linux/arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - --yes
      - ${artifact}

brews:
  - name: azpim
    repository:
      owner: bgs113
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/bgs113/azpim
    description: "CLI for managing Azure Privileged Identity Management (PIM) role assignments"
    skip_upload: auto
    install: |
      bin.install "azpim"
    test: |
      system "#{bin}/azpim", "version"

sboms:
  - artifacts: archive

archives:
  - formats:
      - zip
    name_template: "azpim-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
