name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Only the go.sum files this job builds from, so each job gets its own cache key.
          cache-dependency-path: |
            go.sum
            tools/golangci-lint/go.sum
            tools/govulncheck/go.sum

      - name: Test
        run: go test -mod=readonly ./...

      # Tool versions are pinned in tools/*/go.mod, which Dependabot updates.
      - name: Vulnerability scan
        run: go tool -modfile=tools/govulncheck/go.mod govulncheck ./...

      - name: Lint
        run: go tool -modfile=tools/golangci-lint/go.mod golangci-lint run ./...

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload zizmor's SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/actionlint/go.sum

      # The runner has shellcheck installed, so run: scripts are checked too.
      - name: Lint workflows
        run: go tool -modfile=tools/actionlint/go.mod actionlint -color

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
