# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a new release age a week before proposing it; security updates are not delayed
    groups:
      go-dependencies:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v2.0.6 requires an ultraviolet build (2026-08-11) whose inline renderer
      # leaves huh prompts partly on screen after they're answered. Unit tests
      # can't catch it, so check prompts in a real terminal before taking a
      # newer Lip Gloss.
      - dependency-name: "charm.land/lipgloss/v2"
        versions: ["2.0.6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a new release age a week before proposing it; security updates are not delayed
    groups:
      github-actions:
        patterns:
          - "*"
